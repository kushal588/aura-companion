name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check "src/**/*.{ts,tsx,css}" "tests/**/*.ts" "docs/**/*.md" "*.md" "*.json"

      - name: Unit and integration tests
        run: npm test

      - name: Production web build
        run: npm run build

      - name: Verify no credentials are committed
        run: |
          set -euo pipefail
          # Any key-shaped string in a tracked file fails the build.
          if git grep -nIE '(AIza[0-9A-Za-z_-]{20,}|AQ\.[A-Za-z0-9_-]{20,}|x-goog-api-key["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9_-]{20,})' -- . \
             ':!node_modules' ':!package-lock.json' ':!docs' ':!*.md'; then
            echo "::error::A credential-shaped string was found in the repository."
            exit 1
          fi
          echo "No credentials found in tracked files."

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: aura-web-dist
          path: dist
          retention-days: 7

  rust:
    name: Native core (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux webkit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo check (compiles the native core)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
